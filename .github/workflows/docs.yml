name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - DESIGN.md
      - bench/README.md
      - crates/*/examples/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - DESIGN.md
      - bench/README.md
      - crates/*/examples/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          # No dependency cache: this job publishes the site (zizmor: cache-poisoning).
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # main publishes the site to Cloudflare Pages (kv0.pages.dev); pull requests only build it.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create kv0 --production-branch=main || true
          command: pages deploy site --project-name=kv0 --branch=main
