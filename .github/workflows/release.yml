name: Release

on:
  push:
    tags: ["v*"]
  # release-plz pushes its tags with GITHUB_TOKEN, which does not trigger `push`.
  # Only Release-plz runs on main can trigger this (it runs on push to main, never on pull requests),
  # and the tag job only checks out the commit such a run released.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release-plz]
    types: [completed]
    branches: [main]
  # Build (never publish) the wheels when the release workflow itself changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/install-protoc.sh
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.1.0-beta.1
        required: false

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            # release-plz tags the release PR's own commit; when that PR is merged with a merge
            # commit, the tag sits on the merge's second parent rather than on HEAD.
            workflow_run)
              tag=$( { git tag --points-at HEAD --list 'v*'
                       if git rev-parse -q --verify 'HEAD^2' >/dev/null; then git tag --points-at 'HEAD^2' --list 'v*'; fi
                     } | sort -V | tail -n 1) ;;
            workflow_dispatch) tag=$([[ "$INPUT_TAG" == v* ]] && echo "$INPUT_TAG" || true) ;;
            pull_request) tag="" ;;
            *) tag=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$GITHUB_REF_NAME" || true) ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none}"

  wheels:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: .github/scripts/install-protoc.sh
          args: --release --strip --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdist
          path: dist

  pypi:
    needs: [tag, wheels, sdist]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  install-check:
    needs: [tag, pypi]
    # `./` is the documented form; actionlint (1.7.12) rejects the `$/` syntax zizmor suggests.
    uses: ./.github/workflows/install-check.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.tag.outputs.tag }}
