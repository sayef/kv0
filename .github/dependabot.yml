version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or yanked one is caught upstream first.
    cooldown:
      default-days: 7
    # Patch and minor updates arrive together; each major version gets its own pull request.
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    # kv0 passes Arrow record batches and its object store to and from moraine, so Arrow, Parquet
    # and object_store follow the versions morainedb builds with; they move together with moraine,
    # not on their own. For object_store (0.x) a minor version is a breaking one.
    ignore:
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "object_store"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  # docs/requirements.txt: the documentation site's build tools.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  # uv.lock: the development tools (ruff, pytest, maturin) CI installs with `uv sync`.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
