[package]
name = "kv0-py"
description = "Python bindings for kv0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kv0"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
pyo3-log = "0.13"
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["log"] }
kv0_rs = { package = "kv0", path = "../kv0" }

# Not on macOS, where every mimalloc in a process shares fixed thread slots and pyarrow ships one.
[target.'cfg(target_os = "linux")'.dependencies]
# `local_dynamic_tls`: the module is loaded with dlopen, where initial-exec TLS can exhaust the
# static TLS block ("cannot allocate memory in static TLS block").
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
# `mi_collect`: return memory freed by a large operation (optimize, purge) to the OS.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended", "local_dynamic_tls"] }

[package.metadata.cargo-machete]
# `tracing` is never named in the code: the dependency only turns on its `log` feature, so kv0's
# and Lance's tracing events reach `log` and, through `pyo3-log`, Python's logging.
ignored = ["tracing"]
