[package]
name = "kv0"
description = "Ordered key-value store and experiment-tracking tables on Lance: local disk, S3, GCS, Azure or memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kv0"
readme = "../../README.md"
keywords = ["key-value", "lance", "object-storage", "experiment-tracking", "database"]
categories = ["database-implementations", "data-structures"]
exclude = ["tests/", "examples/", "benches/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["aws", "gcp", "azure"]
# Object store backends, passed through to Lance. Local files and `memory://` are always available.
aws = ["lance/aws"]
gcp = ["lance/gcp"]
azure = ["lance/azure"]
# The Delta Lake engine (delta-rs without DataFusion) for the key-value layer, next to Lance. Off
# by default while both engines coexist. Cargo cannot enable a dependency only when two features
# are on, so `delta` builds all three object-store handlers and registers those whose feature
# (`aws`, `gcp`, `azure`) is on.
delta = [
    "dep:deltalake-core",
    "dep:deltalake-aws",
    "dep:deltalake-gcp",
    "dep:deltalake-azure",
    "dep:url",
    "dep:async-trait",
    "dep:object_store",
    "dep:arrow-schema-59",
    "dep:arrow-59",
    "dep:parquet",
]
# The moraine engine, next to Lance and Delta, while it is built up. Off by default; needs
# Rust 1.95 (moraine's minimum), like `delta`.
# moraine brings its own S3 support, so `aws` needs nothing more for it.
moraine = [
    "dep:morainedb",
    "dep:arrow-schema-59",
    "dep:arrow-59",
    "dep:parquet",
    "dep:object_store",
    "dep:async-trait",
]
# `kv0 migrate`: converts locations written with the Lance engine (kv0 0.1.0-beta.2 and earlier)
# to Delta Lake (`kv0::migrate`, and the `kv0` binary). Off by default.
lance-migrate = ["delta"]

[dependencies]
lance = { version = "14.0.2", default-features = false }
lance-index = { version = "=14.0.2", default-features = false }
arrow-array = { version = "58", features = ["ffi"] }
arrow-schema = "58"
# Arrow 59, the version of the Delta Lake engine; batches cross over the C data interface
# (storage/arrow_bridge.rs).
arrow-array-59 = { package = "arrow-array", version = "59", features = ["ffi"] }
# Delta Lake, pinned exactly: delta-rs builds on a vendor fork of the Delta kernel, so upgrades
# go in their own pull requests. Arrow and Parquet 59 come from its re-exports.
deltalake-core = { version = "=1.1.4", default-features = false, features = ["rustls"], optional = true }
deltalake-aws = { version = "=1.0.0", default-features = false, features = ["rustls"], optional = true }
deltalake-gcp = { version = "=1.0.0", default-features = false, features = ["rustls"], optional = true }
deltalake-azure = { version = "=1.0.0", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }
# moraine, from a local checkout of its main branch until it is published. Arrow 59 batches cross
# to and from kv0's Arrow 58 as for Delta (storage/arrow_bridge.rs); its object_store version is
# the one deltalake-core resolves to, so one fault-injecting store serves both engines.
morainedb = { path = "../../../moraine-main/crates/moraine", optional = true }
arrow-schema-59 = { package = "arrow-schema", version = "59", optional = true }
# The Delta Lake and moraine engines read their Parquet data files directly (kv0's own scans of
# chosen files, and values fetched by row ordinal); the same versions both engines build with.
arrow-59 = { package = "arrow", version = "59", default-features = false, optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "async", "object_store"], optional = true }
object_store = { version = "0.13.2", default-features = false, features = ["aws", "fs"], optional = true }
# Implementing delta-rs's ObjectStore trait (the fault-injecting store of the test hooks).
async-trait = { version = "0.1", optional = true }
# Filtering record batches (records folding).
arrow-select = "58"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "kv0"
path = "src/bin/kv0.rs"
required-features = ["lance-migrate"]

[[bench]]
name = "kv"
harness = false
