[package]
name = "kv0"
description = "Ordered key-value store and experiment-tracking tables on object storage, with moraine (Delta Lake): local disk, S3 or memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kv0"
readme = "../../README.md"
keywords = ["key-value", "delta-lake", "object-storage", "experiment-tracking", "database"]
categories = ["database-implementations", "data-structures"]
exclude = ["tests/", "examples/", "benches/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["aws", "gcp", "azure"]
# Object store backends. They enable nothing today: local files, `memory://` and S3 (including
# S3-compatible servers) are always built into kv0 and moraine. Google Cloud Storage and Azure
# Blob Storage are not supported by moraine yet, so `gs://` and `az://` locations fail with
# `NotSupported` whichever features are on. I kept the three names so that builds that select
# them keep compiling, and so that each can turn on a backend once there is one.
aws = []
gcp = []
azure = []

[dependencies]
# moraine, from a local checkout of its main branch until it is published.
morainedb = { path = "../../../moraine-main/crates/moraine" }
# Arrow and Parquet at the versions moraine builds with.
arrow-array = "59"
arrow-schema = "59"
# Filtering record batches (records folding).
arrow-select = "59"
# Key-value scans read moraine's data files directly, numbering their rows.
parquet = { version = "59", default-features = false, features = ["arrow", "async", "object_store"] }
object_store = { version = "0.13.2", default-features = false, features = ["aws", "fs"] }
# Implementing object_store's trait (the fault-injecting store of the test hooks).
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kv"
harness = false
