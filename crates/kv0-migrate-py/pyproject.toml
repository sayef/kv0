[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kv0-migrate"
description = "Converts kv0 data written with the Lance engine (kv0 0.1.0-beta.2 and earlier) to Delta Lake"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Saiful Islam" }]
requires-python = ">=3.11"
keywords = ["kv0", "migration", "delta-lake", "lance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
dynamic = ["version"]

[project.scripts]
kv0-migrate = "kv0_migrate:main"

[project.urls]
Homepage = "https://github.com/sayef/kv0"
Documentation = "https://github.com/sayef/kv0/blob/main/docs/guides/migration.md"

[tool.maturin]
python-source = "python"
module-name = "kv0_migrate._native"
features = ["pyo3/extension-module", "migrate"]
